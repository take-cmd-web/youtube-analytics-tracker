name: Daily YouTube Metrics Collection

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch public data (Data API v3)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: python src/fetch_data_api.py

      - name: Fetch analytics data (Analytics API)
        env:
          OAUTH_CLIENT_JSON: ${{ secrets.OAUTH_CLIENT_JSON }}
          OAUTH_TOKEN_JSON: ${{ secrets.OAUTH_TOKEN_JSON }}
        run: python src/fetch_analytics_api.py
        continue-on-error: true

      - name: Fetch traffic sources
        env:
          OAUTH_CLIENT_JSON: ${{ secrets.OAUTH_CLIENT_JSON }}
          OAUTH_TOKEN_JSON: ${{ secrets.OAUTH_TOKEN_JSON }}
        run: python src/fetch_traffic_sources.py
        continue-on-error: true

      - name: Fetch impressions and CTR
        env:
          OAUTH_CLIENT_JSON: ${{ secrets.OAUTH_CLIENT_JSON }}
          OAUTH_TOKEN_JSON: ${{ secrets.OAUTH_TOKEN_JSON }}
        run: python src/fetch_impressions.py
        continue-on-error: true

      - name: Fetch retention curves
        env:
          OAUTH_CLIENT_JSON: ${{ secrets.OAUTH_CLIENT_JSON }}
          OAUTH_TOKEN_JSON: ${{ secrets.OAUTH_TOKEN_JSON }}
        run: python src/fetch_retention.py
        continue-on-error: true

      - name: Commit updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quie
