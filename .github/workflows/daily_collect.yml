name: Daily YouTube Metrics Collection

on:
  schedule:
    # 毎日 UTC 03:00 = JST 12:00 に実行
    # cronはUTC基準。JST深夜回したいなら '0 15 * * *' (= JST 00:00) など
    - cron: '0 3 * * *'
  workflow_dispatch:  # 手動実行も可能にする

permissions:
  contents: write  # CSV更新を自動コミットするため

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch public data (Data API v3)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: python src/fetch_data_api.py

      - name: Fetch analytics data (Analytics API)
        env:
          OAUTH_CLIENT_JSON: ${{ secrets.OAUTH_CLIENT_JSON }}
          OAUTH_TOKEN_JSON: ${{ secrets.OAUTH_TOKEN_JSON }}
        run: python src/fetch_analytics_api.py

      - name: Commit updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 変更がなければコミットしない（exit 0で終了）
          if git diff --cached --quiet; then
            echo "変更なし - コミットスキップ"
          else
            git commit -m "chore: daily metrics update $(date -u +%Y-%m-%d)"
            git push
          fi
