<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Analytics</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f4ef;
    --bg-tertiary: #eeede8;
    --text-primary: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-tertiary: #888780;
    --border: rgba(0,0,0,0.12);
    --border-hover: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #2c2c2a;
      --bg-secondary: #222220;
      --bg-tertiary: #1a1a18;
      --text-primary: #f0ede6;
      --text-secondary: #b4b2a9;
      --text-tertiary: #888780;
      --border: rgba(255,255,255,0.1);
      --border-hover: rgba(255,255,255,0.18);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif; background: var(--bg-tertiary); color: var(--text-primary); font-size: 14px; line-height: 1.6; min-height: 100vh; }
  header { background: var(--bg-primary); border-bottom: 0.5px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .hd-left { display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 32px; height: 32px; background: #D85A30; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; flex-shrink: 0; }
  .logo-text { font-size: 15px; font-weight: 500; color: var(--text-primary); }
  .logo-sub { font-size: 12px; color: var(--text-secondary); }
  .live-pill { display: flex; align-items: center; gap: 5px; background: #EAF3DE; color: #3B6D11; border-radius: 99px; padding: 3px 10px; font-size: 11px; font-weight: 500; }
  @media (prefers-color-scheme: dark) { .live-pill { background: #27500A; color: #C0DD97; } }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #639922; animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .updated { font-size: 12px; color: var(--text-tertiary); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
  .kpi-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .kpi-label i { font-size: 14px; }
  .kpi-val { font-size: 26px; font-weight: 500; color: var(--text-primary); line-height: 1; }
  .kpi-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
  .card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 16px; overflow: hidden; }
  .card-hd { padding: 12px 18px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-title { font-size: 13px; font-weight: 500; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
  .card-title i { font-size: 16px; color: var(--text-secondary); }
  .card-meta { font-size: 11px; color: var(--text-tertiary); }
  .card-body { padding: 20px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 680px) { .grid-2 { grid-template-columns: 1fr; } }
  .chart-wrap { position: relative; width: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 16px; font-size: 11px; font-weight: 500; color: var(--text-tertiary); border-bottom: 0.5px solid var(--border); }
  td { padding: 10px 16px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg-secondary); }
  .vtitle { color: var(--text-primary); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vid { font-size: 11px; color: var(--text-tertiary); font-family: monospace; }
  .num { font-variant-numeric: tabular-nums; }
  .accent { color: #0F6E56; font-weight: 500; }
  @media (prefers-color-scheme: dark) { .accent { color: #5DCAA5; } }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
  .b-amber { background: #FAEEDA; color: #854F0B; }
  .b-blue  { background: #E6F1FB; color: #185FA5; }
  .b-teal  { background: #E1F5EE; color: #0F6E56; }
  .b-gray  { background: var(--bg-secondary); color: var(--text-secondary); }
  @media (prefers-color-scheme: dark) {
    .b-amber { background: #633806; color: #FAC775; }
    .b-blue  { background: #0C447C; color: #B5D4F4; }
    .b-teal  { background: #085041; color: #9FE1CB; }
  }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-lbl { font-size: 12px; color: var(--text-secondary); width: 130px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-bg { flex: 1; height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; }
  .f-teal { background: #1D9E75; }
  .f-blue { background: #378ADD; }
  .bar-val { font-size: 12px; color: var(--text-primary); width: 42px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .loading { padding: 32px; text-align: center; color: var(--text-tertiary); font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; font-size: 12px; color: var(--text-secondary); }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <div class="hd-left">
    <div class="logo-icon" aria-hidden="true"><i class="ti ti-player-play"></i></div>
    <div>
      <div class="logo-text">YouTube Analytics</div>
      <div class="logo-sub">中島武信のFinancial_Lab</div>
    </div>
    <div class="live-pill" role="status"><div class="live-dot"></div>live</div>
  </div>
  <div class="updated" id="updatedAt">読み込み中…</div>
</header>

<main>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label"><i class="ti ti-users" aria-hidden="true"></i>登録者数</div><div class="kpi-val" id="kSubs">—</div><div class="kpi-sub">最新</div></div>
    <div class="kpi"><div class="kpi-label"><i class="ti ti-eye" aria-hidden="true"></i>総再生回数</div><div class="kpi-val" id="kViews">—</div><div class="kpi-sub">全期間</div></div>
    <div class="kpi"><div class="kpi-label"><i class="ti ti-video" aria-hidden="true"></i>動画本数</div><div class="kpi-val" id="kVids">—</div><div class="kpi-sub">公開中</div></div>
    <div class="kpi"><div class="kpi-label"><i class="ti ti-click" aria-hidden="true"></i>平均CTR</div><div class="kpi-val" id="kCtr">—</div><div class="kpi-sub">クリック率</div></div>
    <div class="kpi"><div class="kpi-label"><i class="ti ti-activity" aria-hidden="true"></i>平均維持率</div><div class="kpi-val" id="kRet">—</div><div class="kpi-sub">直近30日</div></div>
  </div>

  <div class="card">
    <div class="card-hd"><div class="card-title"><i class="ti ti-users" aria-hidden="true"></i>登録者推移</div><div class="card-meta">日次スナップショット</div></div>
    <div class="card-body"><div class="chart-wrap" style="height:200px"><canvas id="cSubs" role="img" aria-label="チャンネル登録者の日次推移">登録者推移</canvas></div></div>
  </div>

  <div class="card">
    <div class="card-hd"><div class="card-title"><i class="ti ti-chart-bar" aria-hidden="true"></i>動画別 視聴回数</div><div class="card-meta">最新データ</div></div>
    <div class="card-body"><div class="chart-wrap" id="viewsWrap" style="height:240px"><canvas id="cViews" role="img" aria-label="動画別視聴回数">視聴回数</canvas></div></div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-hd"><div class="card-title"><i class="ti ti-activity" aria-hidden="true"></i>平均視聴維持率</div><div class="card-meta">動画別</div></div>
      <div class="card-body" id="retBars"><div class="loading">読み込み中…</div></div>
    </div>
    <div class="card">
      <div class="card-hd"><div class="card-title"><i class="ti ti-arrow-ramp-right" aria-hidden="true"></i>流入元</div><div class="card-meta">チャンネル全体</div></div>
      <div class="card-body" id="trafBars"><div class="loading">読み込み中…</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><div class="card-title"><i class="ti ti-trophy" aria-hidden="true"></i>動画ランキング</div><div class="card-meta">視聴回数順</div></div>
    <div id="vidTable"><div class="loading">読み込み中…</div></div>
  </div>

  <div class="card">
    <div class="card-hd"><div class="card-title"><i class="ti ti-chart-line" aria-hidden="true"></i>視聴維持率カーブ</div><div class="card-meta">動画ごとの推移</div></div>
    <div class="card-body">
      <div id="retLeg" class="legend"></div>
      <div class="chart-wrap" style="height:260px"><canvas id="cRet" role="img" aria-label="視聴維持率カーブ">視聴維持率カーブ</canvas></div>
    </div>
  </div>

</main>

<script>
const BASE = 'https://raw.githubusercontent.com/take-cmd-web/youtube-analytics-tracker/refs/heads/main/data';
const URLS = { channel:`${BASE}/channel_daily.csv`, videos:`${BASE}/videos_daily.csv`, analytics:`${BASE}/analytics_daily.csv`, traffic:`${BASE}/traffic_sources.csv`, impressions:`${BASE}/impressions_ctr.csv`, retention:`${BASE}/retention_curves.csv` };
const TL = { BROWSE:'ブラウジング機能', EXT_URL:'外部サイト', RELATED_VIDEO:'関連動画', YT_SEARCH:'YouTube検索', YT_CHANNEL:'チャンネルページ', SUBSCRIBER:'登録者通知', PLAYLIST:'再生リスト', NO_LINK_OTHER:'ダイレクト', NOTIFICATION:'通知', END_SCREEN:'終了画面', SHORTS:'ショート', HASHTAGS:'ハッシュタグ' };
const PAL = ['#1D9E75','#378ADD','#D85A30','#BA7517','#533AB7','#993556'];
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const grid = dark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.06)';
const tc = '#888780';

function parse(txt) {
  const ls = txt.trim().split('\n');
  const hs = ls[0].split(',').map(h=>h.trim().replace(/\r/g,''));
  return ls.slice(1).map(l=>{ const vs=l.split(',').map(v=>v.trim().replace(/\r/g,'')); const o={}; hs.forEach((h,i)=>o[h]=vs[i]??''); return o; });
}
async function get(url) { const r=await fetch(url); if(!r.ok) throw new Error(url); return parse(await r.text()); }
function latest(rows, key, dt='snapshot_date') { const m={}; for(const r of rows){if(!m[r[key]]||r[dt]>m[r[key]][dt])m[r[key]]=r;} return Object.values(m); }
function fmt(n) { return Number(n).toLocaleString('ja-JP'); }
function pct(n) { return (+n).toFixed(1)+'%'; }
function dur(s) { const n=Math.round(+s); return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`; }

Chart.defaults.font.family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";
Chart.defaults.font.size=11; Chart.defaults.color=tc;

async function init() {
  try {
    const [ch,vid,ana,traf,imp,ret] = await Promise.all(Object.values(URLS).map(get));
    const ld=[...ch].sort((a,b)=>b.snapshot_date.localeCompare(a.snapshot_date))[0]?.snapshot_date||'';
    document.getElementById('updatedAt').textContent=`更新: ${ld}`;
    kpi(ch,ana,imp); subs(ch); views(vid); retBars(ana,vid); trafBars(traf); table(vid,ana,imp); retCurve(ret,vid);
  } catch(e) { console.error(e); document.getElementById('updatedAt').textContent='読み込みエラー'; }
}

function kpi(ch,ana,imp) {
  const l=[...ch].sort((a,b)=>b.snapshot_date.localeCompare(a.snapshot_date))[0]||{};
  document.getElementById('kSubs').textContent=fmt(l.subscriber_count||0);
  document.getElementById('kViews').textContent=fmt(l.view_count||0);
  document.getElementById('kVids').textContent=l.video_count||'—';
  const cs=imp.filter(r=>+r.impressions_ctr>0).map(r=>+r.impressions_ctr);
  document.getElementById('kCtr').textContent=cs.length?pct(cs.reduce((a,b)=>a+b,0)/cs.length):'—';
  const rs=latest(ana,'video_id').filter(r=>+r.average_view_percentage>0).map(r=>+r.average_view_percentage);
  document.getElementById('kRet').textContent=rs.length?pct(rs.reduce((a,b)=>a+b,0)/rs.length):'—';
}

function subs(ch) {
  const m={}; for(const r of ch){const k=r.snapshot_date;if(!m[k]||+r.subscriber_count>+m[k].subscriber_count)m[k]=r;}
  const s=Object.values(m).sort((a,b)=>a.snapshot_date.localeCompare(b.snapshot_date));
  new Chart(document.getElementById('cSubs'),{type:'line',data:{labels:s.map(r=>r.snapshot_date.slice(5)),datasets:[{label:'登録者数',data:s.map(r=>+r.subscriber_count),borderColor:'#1D9E75',backgroundColor:'rgba(29,158,117,0.08)',borderWidth:2,pointRadius:3,tension:0.3,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:grid}},y:{grid:{color:grid},beginAtZero:false}}}});
}

function views(vid) {
  const vs=latest(vid,'video_id').filter(r=>r.title&&+r.view_count>0).sort((a,b)=>+b.view_count - +a.view_count).slice(0,6);
  const w=document.getElementById('viewsWrap'); w.style.height=(vs.length*44+60)+'px';
  new Chart(document.getElementById('cViews'),{type:'bar',data:{labels:vs.map(v=>v.title.length>20?v.title.slice(0,20)+'…':v.title),datasets:[{label:'視聴回数',data:vs.map(v=>+v.view_count),backgroundColor:PAL.map(c=>c+'28'),borderColor:PAL,borderWidth:1.5,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:grid},beginAtZero:true},y:{grid:{display:false}}}}});
}

function retBars(ana,vid) {
  const tm={}; for(const r of vid)if(r.title)tm[r.video_id]=r.title;
  const ls=latest(ana,'video_id').filter(r=>+r.average_view_percentage>0).sort((a,b)=>+b.average_view_percentage - +a.average_view_percentage);
  const el=document.getElementById('retBars');
  if(!ls.length){el.innerHTML='<div class="loading">データなし</div>';return;}
  el.innerHTML=ls.map(r=>{const t=tm[r.video_id]||r.video_id;const p=(+r.average_view_percentage).toFixed(1);return`<div class="bar-row"><div class="bar-lbl" title="${t}">${t.length>16?t.slice(0,16)+'…':t}</div><div class="bar-bg"><div class="bar-fill f-teal" style="width:${Math.min(+p,100)}%"></div></div><div class="bar-val">${p}%</div></div>`;}).join('');
}

function trafBars(traf) {
  const all=traf.filter(r=>r.video_id==='ALL');
  const src=all.length?all:traf;
  const agg={}; for(const r of src){const k=TL[r.traffic_source_type]||r.traffic_source_type;agg[k]=(agg[k]||0)+(+r.views||0);}
  const sorted=Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=sorted[0]?.[1]||1;
  document.getElementById('trafBars').innerHTML=sorted.map(([l,v])=>`<div class="bar-row"><div class="bar-lbl">${l}</div><div class="bar-bg"><div class="bar-fill f-blue" style="width:${(v/max*100).toFixed(1)}%"></div></div><div class="bar-val">${fmt(v)}</div></div>`).join('');
}

function table(vid,ana,imp) {
  const vs=latest(vid,'video_id').filter(r=>r.title&&+r.view_count>0).sort((a,b)=>+b.view_count - +a.view_count);
  const am=Object.fromEntries(latest(ana,'video_id').map(r=>[r.video_id,r]));
  const im=Object.fromEntries(latest(imp,'video_id').map(r=>[r.video_id,r]));
  const bclass=['b-amber','b-blue','b-teal'];
  const rows=vs.map((v,i)=>{const a=am[v.video_id]||{};const p=im[v.video_id]||{};const rank=i<3?`<span class="badge ${bclass[i]}">${i+1}位</span>`:`<span style="color:var(--text-tertiary);font-size:12px">${i+1}</span>`;return`<tr><td>${rank}</td><td><div class="vtitle">${v.title}</div><div class="vid">${v.video_id}</div></td><td class="num accent">${fmt(v.view_count)}</td><td class="num">${v.like_count!==''?fmt(v.like_count):'—'}</td><td class="num">${a.average_view_percentage?pct(a.average_view_percentage):'—'}</td><td class="num">${a.average_view_duration_sec?dur(a.average_view_duration_sec):'—'}</td><td class="num">${p.impressions_ctr?pct(p.impressions_ctr):'—'}</td><td style="color:var(--text-tertiary);font-size:12px">${v.published_at?v.published_at.slice(0,10):'—'}</td></tr>`;}).join('');
  document.getElementById('vidTable').innerHTML=`<table><thead><tr><th></th><th>タイトル</th><th>再生数</th><th>👍</th><th>維持率</th><th>平均視聴時間</th><th>CTR</th><th>公開日</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function retCurve(ret,vid) {
  const tm={}; for(const r of vid)if(r.title)tm[r.video_id]=r.title;
  const bv={}; for(const r of ret){if(!bv[r.video_id])bv[r.video_id]=[];bv[r.video_id].push(r);}
  const ents=Object.entries(bv).slice(0,4);
  document.getElementById('retLeg').innerHTML=ents.map(([v],i)=>`<span class="legend-item"><span class="legend-dot" style="background:${PAL[i]}"></span>${(tm[v]||v).slice(0,20)}</span>`).join('');
  new Chart(document.getElementById('cRet'),{type:'line',data:{datasets:ents.map(([v,pts],i)=>({label:(tm[v]||v).slice(0,20),data:pts.sort((a,b)=>+a.elapsed_video_time_ratio - +b.elapsed_video_time_ratio).map(p=>({x:+(+p.elapsed_video_time_ratio*100).toFixed(1),y:+(+p.audience_watch_ratio*100).toFixed(2)})),borderColor:PAL[i],backgroundColor:'transparent',borderWidth:2,pointRadius:0,tension:0.3}))},options:{responsive:true,maintainAspectRatio:false,parsing:false,plugins:{legend:{display:false}},scales:{x:{type:'linear',min:0,max:100,grid:{color:grid},title:{display:true,text:'再生位置 (%)',color:tc}},y:{min:0,max:100,grid:{color:grid},title:{display:true,text:'維持率 (%)',color:tc}}}}});
}

init();
</script>
</body>
</html>
